<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Acessível</title>
  <!-- Bootstrap Icons (para o ícone do botão de contraste) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <!-- Link to the external CSS file -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <button id="botao-acessibilidade" class="btn btn-primary fw-bold -botao" aria-expanded="false">
    acessibilidade
  </button>

  <div id="opcoes-acessibilidade" class="opcoes-acessibilidade apresenta-lista">
    <button id="aumentar-fonte" class="btn btn-primary fw-bold" aria-label="aumentar o tamanho da fonte">A+</button>
    <button id="diminuir-fonte" class="btn btn-primary fw-bold" aria-label="diminuir o tamanho da fonte">A-</button>
    <button id="alterna-contraste" class="btn btn-primary fw-bold" aria-label="ativar/desativar alto contraste">
      <i class="bi bi-shadows"></i>
    </button>
  </div>

  <section id="tropicalia" class="my-5 pt-6 secao-tropicalia" tabindex="0" aria-label="Seção explicativa sobre a tropicália">
    <div class="container d-flex align-items-center">
      <div class="col-4 d-flex justify-content-center fundo-galeria">
        <p>Conteúdo da Tropicália aqui</p>
      </div>
    </div>
  </section>

  <section id="galeria" tabindex="0" aria-label="Seção de galeria de imagens">
    <h2 class="text-center pt-5">Galeria</h2>
    <div class="container p-3 mt-3 fundo-galeria">
      
      <div class="row justify-content-md-center">
        <div class="col-md-4">
          <img src="slides/jorge-ben" 
               class="img-fluid rounded-5" loading="lazy"
               alt="Jorge Ben ao lado do Trio Mocotó em apresentação em 1971"
               title="Jorge Ben e o Trio Mocotó - CC0 Domínio Público / Acervo Arquivo Nacional">
        </div>
        <div class="col-md-4">
          <img src="slides/os-mutantes-2" 
               class="img-fluid rounded-5" loading="lazy"
               alt="O grupo Os Mutantes em apresentação"
               title="Os Mutantes - CC0 Domínio Público / Acervo Arquivo Nacional">
        </div>
      </div>
  
      <div class="row mt-4 justify-content-md-center">
        <div class="col-md-4">
          <img src="slides/gilberto" 
               class="img-fluid rounded-5" loading="lazy"
               alt="Gilberto Gil cantando durante os anos 1960"
               title="Gilberto Gil - CC0 Domínio Público / Acervo Arquivo Nacional">
        </div>
        <div class="col-md-4">
          <img src="slides/caetano" 
               class="img-fluid rounded-5" loading="lazy"
               alt="Caetano Veloso no III Festival da Música Popular Brasileira"
               title="Caetano Veloso - CC0 Domínio Público / Acervo Arquivo Nacional">
        </div>
      </div>
  
    </div>
  </section>

  <footer>
    <p>Rodapé do site</p>
  </footer>

</html>
